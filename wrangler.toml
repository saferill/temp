name = "tempik"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Set workers_dev to false when using your own domain
workers_dev = false

# ---- D1 Database ----
# Step 1: run `npx wrangler d1 create tempik-db`
# Step 2: copy the database_id here
[[d1_databases]]
binding = "DB"
database_name = "tempik-db"
database_id = "54dcd7a9-0ea0-4bfd-af0d-4b91a39c95ad"

# ---- Email Worker ----
[email]
action = "process"

# ---- Custom domain routes ----
# CHANGE THIS to your own domain (e.g. tempik.example.com)
[[routes]]
pattern = "tempik.cinewatch.web.id"
custom_domain = true

# ---- Environment variables ----
[vars]
APP_NAME = "Tempik Mail"
MAIL_DOMAIN = "cinewatch.web.id"
WEB_HOST = "tempik.cinewatch.web.id"

# ---- Static assets (web frontend) ----
[assets]
directory = "./src/web"

# ---- Observability ----
[observability]
enabled = true
